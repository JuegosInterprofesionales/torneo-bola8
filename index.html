<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tablas de Posiciones</title>

<style>
body { font-family: Arial; margin: 20px; }
.tabs { display: flex; gap: 20px; margin-bottom: 20px; }
.tab { cursor: pointer; padding: 10px 20px; background: #ddd; border-radius: 5px; }
.tab.active { background: #4CAF50; color: white; }

table { border-collapse: collapse; width: 100%; margin-bottom: 25px; }
th, td { border: 1px solid #999; padding: 6px; text-align: center; }
h2 { margin-top: 30px; }
</style>
</head>

<body>

<h1>Tablas de Posiciones</h1>

<div class="tabs">
    <div class="tab active" onclick="mostrar('bola8', this)">Bola 8</div>
    <div class="tab" onclick="mostrar('billar', this)">Billar</div>
</div>

<div id="contenido"></div>

<script>
function mostrar(torneo, tab) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    cargarTorneo(torneo);
}

async function cargarTorneo(torneo) {
    const cont = document.getElementById("contenido");
    cont.innerHTML = "";

    try {
        const resp = await fetch("resultados.json");
        const data = await resp.json();

        const grupos = data[torneo];

        for (const nombreGrupo in grupos) {
            const tabla = grupos[nombreGrupo];

            let html = `<h2>Grupo ${nombreGrupo}</h2><table><tr>`;

            // Detectar columnas según torneo
            if (torneo === "bola8") {
                html += `
                    <th>POS</th><th>GREMIO</th><th>PJ</th><th>PG</th><th>PE</th>
                    <th>PP</th><th>GF</th><th>GC</th><th>PTS</th><th>GD</th>
                `;
            } else {
                html += `
                    <th>POS</th><th>GREMIO</th><th>PJ</th><th>PG</th><th>PP</th>
                    <th>TF</th><th>TC</th><th>PF</th><th>PC</th><th>PTS</th>
                    <th>PD</th><th>CD</th>
                `;
            }

            html += "</tr>";

            tabla.forEach(t => {
                html += "<tr>";

                for (const campo in t) {
                    html += `<td>${t[campo]}</td>`;
                }

                html += "</tr>";
            });

            html += "</table>";
            cont.innerHTML += html;
        }

    } catch (e) {
        cont.innerHTML = "Error cargando datos: " + e;
    }
}

// Cargar Bola 8 al iniciar
cargarTorneo("bola8");
</script>

</body>
</html>
